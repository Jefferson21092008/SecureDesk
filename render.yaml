services:
  - type: web
    name: securedesk
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./docker/Dockerfile.production
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: SecureDesk
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ISSUER
        value: securedesk
      - key: JWT_AUDIENCE
        value: securedesk-api
      - key: ACCESS_TOKEN_MINUTES
        value: "30"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ATTACHMENTS_DIR
        value: /tmp/securedesk-attachments
      - key: ATTACHMENT_MAX_BYTES
        value: "5242880"
      # Select s3 (Supabase) or r2 only after configuring a private bucket.
      # Do not hardcode a value here: Blueprint sync must not reset it to local.
      - key: ATTACHMENT_STORAGE_BACKEND
        sync: false
      # The four R2 settings below must be configured as Render secrets (never commit values).
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Supabase S3 settings. Set privately in Render only after local live tests.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
