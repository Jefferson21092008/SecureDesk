services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securedesk}
      POSTGRES_USER: ${POSTGRES_USER:-securedesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securedesk}
    volumes:
      - securedesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securedesk} -d ${POSTGRES_DB:-securedesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-SecureDesk}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-securedesk}:${POSTGRES_PASSWORD:-securedesk}@db:5432/${POSTGRES_DB:-securedesk}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  securedesk_pgdata:
