name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://securedesk:securedesk@localhost:5432/securedesk_test
      JWT_SECRET: ci-only-secret-that-is-not-used-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_MINUTES: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: securedesk_test
          POSTGRES_USER: securedesk
          POSTGRES_PASSWORD: securedesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securedesk -d securedesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: python -m compileall -q app tests alembic
      - run: python -m ruff check .
      - name: Validate Alembic migration on PostgreSQL
        run: alembic upgrade head
      - run: python -m pytest -q
